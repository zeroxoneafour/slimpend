[package]
name = "slimpend"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", features = [ "bluetoothd" ] }
clap = { version = "4.6.6", features = [ "derive" ] }
evdev = { version = "0.13.2", features = [ "tokio" ] }
hex-literal = "1.1.0"
hidapi = { version = "2.6.6", default-features = false, features = [ "linux-shared-hidraw" ] }
tokio = { version = "1.53.1", features = [ "signal" ] }
tokio-stream = "0.1.19"
